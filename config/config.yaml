data:
  processed_path: "data/processed/processed.csv"
  train_path: "data/split/train.csv"
  val_path: "data/split/val.csv"
  test_path: "data/split/test.csv"
  cfg_dot_col: "cfg_dot"
  cfg_nodes_col: "cfg_nodes"
  cfg_edges_col: "cfg_edges"
  cfg_density_col: "cfg_density"
  label_col: "label_encoded" # 0: benign, 1: unchecked_calls
  opcode_col: "opcode"
  bytecode_col: "bytecode"
  test_size: 0.15
  val_size: 0.15
  random_seed: 42

features:
  chunk_size: 256
  chunk_overlap: 32
  max_chunks: 12
  vocab_min_freq: 3
  bytecode_ngram_dim: 64

model:
  trans_hidden: 256
  trans_layers: 3
  trans_heads: 8
  trans_dropout: 0.20
  gat_hidden: 128
  gat_layers: 3
  gat_heads: 4
  gat_dropout: 0.20
  gat_edge_dim: 8
  fusion_heads: 8
  fusion_dropout: 0.20

training:
  lr: 8.0e-5
  weight_decay: 3.0e-4
  batch_size: 32
  epochs: 15
  patience: 15
  focal_gamma: 2.0
  focal_alpha: 0.5 

output:
  checkpoint_dir: "models/checkpoints"
  log_dir: "logs/tensorboard"